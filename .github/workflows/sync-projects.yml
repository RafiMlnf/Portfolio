name: Sync Portfolio Projects & Deploy

on:
  # Trigger otomatis setiap push ke main
  push:
    branches: [ main ]
  # Trigger otomatis terjadwal (misal setiap hari jam 00:00 UTC)
  schedule:
    - cron: '0 0 * * *'
  # Trigger manual dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with GitHub API sync
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: npm run build
